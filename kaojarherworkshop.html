<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kaojarherWorkshop 數位工具車庫</title>
    <style>
        :root {
            --garage-dark: #121418;
            --garage-slate: #1a1d24;
            --garage-panel: #222630;
            --metal-gray: #4a5162;
            --neon-amber: #ff9f1c;
            --neon-orange: #ff5400;
            --neon-cyan: #00e5ff;
            --text-light: #e0e6ed;
            --text-muted: #8c9ba5;
            --border-amber: rgba(255, 159, 28, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang HK', 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--garage-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 車庫金屬網格與工業條紋背景 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
              linear-gradient(rgba(255, 159, 28, 0.03) 1px, transparent 1px),
              linear-gradient(90deg, rgba(255, 159, 28, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 25px 20px;
            background: linear-gradient(to bottom, #090a0c, var(--garage-slate));
            border-bottom: 3px solid var(--neon-amber);
            box-shadow: 0 4px 25px rgba(0,0,0,0.8);
            z-index: 1;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 3px;
            background: repeating-linear-gradient(
                45deg,
                var(--neon-amber),
                var(--neon-amber) 15px,
                #121418 15px,
                #121418 30px
            );
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--neon-amber);
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(255, 159, 28, 0.5);
            text-transform: uppercase;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* 設定與操作控制列 */
        .control-panel {
            width: 100%;
            max-width: 1400px;
            padding: 20px 30px 0 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            z-index: 1;
        }

        .settings-bar {
            flex: 1;
            min-width: 300px;
            background: rgba(34, 38, 48, 0.85);
            border: 1px solid var(--metal-gray);
            border-left: 4px solid var(--neon-amber);
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .settings-bar label {
            font-size: 13px;
            color: var(--neon-amber);
            white-space: nowrap;
            font-weight: bold;
        }

        .settings-bar input[type="text"] {
            flex: 1;
            background: rgba(18, 20, 24, 0.9);
            border: 1px solid var(--metal-gray);
            border-radius: 4px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border 0.2s;
        }

        .settings-bar input[type="text"]:focus {
            border-color: var(--neon-amber);
        }

        .btn {
            padding: 8px 18px;
            border-radius: 4px;
            border: 1px solid var(--neon-amber);
            background: transparent;
            color: var(--neon-amber);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            text-transform: uppercase;
        }
        .btn:hover {
            background: var(--neon-amber);
            color: var(--garage-dark);
            box-shadow: 0 0 12px rgba(255, 159, 28, 0.6);
        }
        .btn.primary {
            background: linear-gradient(135deg, var(--neon-amber), var(--neon-orange));
            color: #fff;
            border: none;
        }
        .btn.primary:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 15px rgba(255, 84, 0, 0.6);
        }

        .fetch-status {
            font-size: 13px;
            color: var(--neon-amber);
            width: 100%;
            margin-top: 5px;
            display: none;
            background: rgba(255, 159, 28, 0.1);
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 3px solid var(--neon-amber);
        }
        .fetch-status.visible { display: block; }

        .container {
            display: flex;
            width: 100%;
            max-width: 1400px;
            padding: 20px 30px 30px 30px;
            gap: 30px;
            z-index: 1;
        }

        /* 車庫主體藍圖/地圖區 */
        .map-wrapper {
            flex: 1.2;
            background: radial-gradient(circle, #1a222d 0%, #0d1117 100%);
            border: 2px solid var(--metal-gray);
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.8);
            aspect-ratio: 4 / 3;
            overflow: hidden;
            height: fit-content;
        }

        .map-svg {
            width: 100%;
            height: 100%;
        }

        /* 詳細資訊面板 (洞洞板風格) */
        .info-panel {
            flex: 1;
            background: var(--garage-panel);
            border: 1px solid var(--metal-gray);
            border-top: 4px solid var(--neon-amber);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 750px;
            overflow-y: auto;
            position: relative;
        }

        .panel-title {
            color: var(--neon-amber);
            font-size: 1.4rem;
            border-bottom: 2px solid rgba(255, 159, 28, 0.2);
            padding-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }

        .zone-card {
            background: rgba(18, 20, 24, 0.6);
            border-left: 4px solid var(--neon-amber);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 15px;
        }

        .zone-card h3 {
            color: var(--neon-amber);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        /* 整合設施卡片與實時畫面外觀 */
        .repo-item {
            background: var(--garage-slate);
            border: 1px solid var(--metal-gray);
            border-radius: 8px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s, border-color 0.2s;
        }

        .repo-item:hover {
            transform: translateY(-2px);
            border-color: var(--neon-amber);
        }

        /* 預覽畫面視窗 */
        .card-screenshot {
            width: 100%;
            height: 160px;
            background: #090a0c;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--metal-gray);
        }

        /* 實時 iframe 容器與縮放比 */
        .card-screenshot .iframe-wrap {
            position: absolute;
            inset: 0;
            z-index: 2;
            overflow: hidden;
            background: #fff;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .card-screenshot .iframe-wrap.loaded {
            opacity: 1;
        }
        .card-screenshot .iframe-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px; 
            height: 700px;
            border: none;
            transform-origin: top left;
            pointer-events: none;
        }

        /* GitHub OpenGraph 備份預覽圖 */
        .card-screenshot img.preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 2;
        }
        .card-screenshot img.preview-img.loaded {
            opacity: 1;
        }

        /* 未加載完成時的默認佔位背景 */
        .card-screenshot .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #12151c, #1a202c);
            z-index: 1;
        }
        .card-screenshot .placeholder .emoji { font-size: 32px; }
        .card-screenshot .placeholder .url-preview {
            font-size: 10px;
            color: var(--neon-amber);
            opacity: 0.7;
            max-width: 80%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 微光載入效果 */
        .card-screenshot .shimmer {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,159,28,0.15) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            pointer-events: none;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .repo-detail-wrap {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .repo-name {
            font-weight: bold;
            color: #fff;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .repo-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .repo-links {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .repo-link {
            flex: 1;
            font-size: 0.8rem;
            color: var(--garage-dark);
            background: linear-gradient(135deg, var(--neon-cyan), #00b4d8);
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0, 229, 255, 0.3);
        }

        .repo-link:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 12px rgba(0, 229, 255, 0.5);
        }

        .clickable-zone {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .clickable-zone:hover {
            filter: drop-shadow(0px 0px 10px rgba(255, 159, 28, 0.8));
            opacity: 0.95;
        }

        @keyframes pulse-amber {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .castle-marker {
            animation: pulse-amber 3s infinite ease-in-out;
        }

        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--garage-panel);
            border: 1px solid var(--neon-amber);
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 999;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        #toast.show { transform: translateY(0); opacity: 1; }

        footer {
            margin-top: auto;
            width: 100%;
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 159, 28, 0.2);
            background: #090a0c;
        }

        @media (max-width: 1024px) {
            .container { flex-direction: column; }
            .map-wrapper { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>kaojarherWorkshop</h1>
        <p>🔧 數位車庫工具箱集景 (Digital Garage) 🛠️</p>
    </header>

    <!-- GitHub 抓取控制列 -->
    <div class="control-panel">
        <div class="settings-bar">
            <label>⚙️ 整備廠帳號：</label>
            <input type="text" id="fetchUsername" value="kaojarher" placeholder="輸入 GitHub 帳號">
            <button class="btn primary" onclick="fetchAndCategorize()"><span id="btnText">⚡ 盤點車庫工具</span></button>
        </div>
        <div class="fetch-status" id="fetchStatus"></div>
    </div>

    <div class="container">
        <!-- 左側：車庫藍圖/平面分區圖 -->
        <div class="map-wrapper">
            <svg class="map-svg" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
                <!-- 車庫網格背景線條 -->
                <rect width="800" height="600" fill="#0f1217"/>
                <g stroke="#1a222d" stroke-width="1">
                    <line x1="0" y1="150" x2="800" y2="150"/>
                    <line x1="0" y1="300" x2="800" y2="300"/>
                    <line x1="0" y1="450" x2="800" y2="450"/>
                    <line x1="200" y1="0" x2="200" y2="600"/>
                    <line x1="400" y1="0" x2="400" y2="600"/>
                    <line x1="600" y1="0" x2="600" y2="600"/>
                </g>

                <!-- 外圍斜紋警戒線邊框 -->
                <rect x="10" y="10" width="780" height="580" fill="none" stroke="#ff9f1c" stroke-width="2" stroke-dasharray="10,5" opacity="0.3"/>

                <!-- 1. 中央入口 / 升降機門戶 -->
                <g class="clickable-zone" onclick="showZone('mainstreet')">
                    <path d="M 320,450 L 480,450 L 460,570 L 340,570 Z" fill="#2d3436" opacity="0.9" stroke="#ff9f1c" stroke-width="2"/>
                    <text x="400" y="520" fill="#ff9f1c" font-size="14" font-weight="bold" text-anchor="middle">🚪 主控制台 & 升降台</text>
                </g>

                <!-- 2. 車庫核心工作台 -->
                <g class="clickable-zone castle-marker" onclick="showZone('castle')">
                    <circle cx="400" cy="310" r="50" fill="#343a40" stroke="#00e5ff" stroke-width="2"/>
                    <polygon points="400,270 375,320 425,320" fill="#ff9f1c"/>
                    <text x="400" y="315" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">🧰 旗艦重型工具桌</text>
                </g>

                <!-- 3. 自動化與引擎改裝區 -->
                <g class="clickable-zone" onclick="showZone('adventure')">
                    <path d="M 280,100 Q 400,60 520,100 L 490,230 Q 400,240 310,230 Z" fill="#1e272e" stroke="#ff9f1c" stroke-width="1.5"/>
                    <text x="400" y="155" fill="#e0e6ed" font-size="14" font-weight="bold" text-anchor="middle">⚙️ 腳本與自動化檢修區</text>
                </g>

                <!-- 4. 高效能動力與系統區 -->
                <g class="clickable-zone" onclick="showZone('tomorrow')">
                    <path d="M 540,220 Q 700,180 750,260 L 690,410 Q 560,370 520,320 Z" fill="#1e272e" stroke="#00e5ff" stroke-width="1.5"/>
                    <text x="630" y="300" fill="#e0e6ed" font-size="14" font-weight="bold" text-anchor="middle">🏎️ 效能與系統儀表區</text>
                </g>

                <!-- 5. 隨手便攜工具掛牆 -->
                <g class="clickable-zone" onclick="showZone('puzzle')">
                    <path d="M 60,150 Q 180,120 250,170 L 220,270 Q 130,230 80,210 Z" fill="#1e272e" stroke="#ff9f1c" stroke-width="1.5"/>
                    <text x="155" y="195" fill="#e0e6ed" font-size="14" font-weight="bold" text-anchor="middle">🔨 洞洞板輕量工具牆</text>
                </g>
            </svg>
        </div>

        <!-- 右側：車庫分區工具清單面板 -->
        <div class="info-panel" id="info-panel">
            <h2 class="panel-title" id="panel-title">歡迎進入 kaojarher 數位工具車庫</h2>
            <div id="panel-content">
                <p style="text-align: center; color: var(--neon-amber); font-style: italic; margin-top: 20px;">
                    ✦ 嚴格淨化：全面掃描 Name、Description 及 Topics 標籤，徹底封殺所有遊戲專案 ✦
                </p>
            </div>
        </div>
    </div>

    <div id="toast"></div>
    <footer><p>&copy; 2026 kaojarherWorkshop 數位車庫工具箱</p></footer>

    <script>
        let parkZones = {
            mainstreet: { title: "主控制台 & 升降台 (Garage Portal)", desc: "車庫門戶入口，擺放綜合專案與整備廠導覽門戶。", repos: [] },
            castle: { title: "🧰 旗艦重型工具桌 (Flagship Master Tools)", desc: "車庫核心。展示獲得較多 Stars 或最具代表性的主力開發工具箱。", repos: [] },
            adventure: { title: "⚙️ 腳本與自動化檢修區 (Dev & Automation Tools)", desc: "包含【自動化、腳本、部署、開源開發】相關工具。", repos: [] },
            tomorrow: { title: "🏎️ 效能與系統儀表區 (System & Performance Tools)", desc: "包含【系統監控、效能優化、高效率作業】相關工具。", repos: [] },
            puzzle: { title: "🔨 洞洞板輕量工具牆 (Handy Utilities)", desc: "包含【日常計算、轉換器、輕量小幫手】等隨手拿取使用的工具。", repos: [] }
        };

        // 廣義遊戲相關黑名單關鍵字
        const GAME_BLACK_LIST = [
            'game', 'games', 'gaming', 'gamer', 'unity', 'godot', 'phaser', 'rpg', 
            'arcade', 'tetris', 'snake', 'puzzle', 'canvas-game', 'mini-game', 'boardgame', 
            'card-game', 'flappy', 'mario', 'pokemon', 'roguelike', 'chess', 'sudoku',
            '遊戲', '小遊戲', '貪食蛇', '井字', '賽車', '射擊', '益智', '桌遊', '娛樂', '魔王', '闖關'
        ];

        // 預設樣品數據
        function loadMockData() {
            parkZones.mainstreet.repos = [{ name: "kaojarher-garage-portal", description: "kaojarher 數位車庫總控台與綜合工具清單入口", html_url: "https://kaojarher.github.io/kaojarherWorkshop/", homepage: "https://kaojarher.github.io/kaojarherWorkshop/" }];
            parkZones.castle.repos = [{ name: "DevOps-Toolkit-Pro", description: "一款全方位的自動化部署與系統維運重型工具箱", html_url: "https://github.com/kaojarher/DevOps-Toolkit-Pro", homepage: "" }];
            parkZones.adventure.repos = [{ name: "auto-script-builder", description: "協助開發者快速生成腳本的自動化軟體工具", html_url: "https://github.com/kaojarher/auto-script-builder", homepage: "" }];
            parkZones.tomorrow.repos = [{ name: "speed-system-monitor", description: "高效能即時監控與系統資源檢測分析工具", html_url: "https://github.com/kaojarher/speed-system-monitor", homepage: "" }];
            parkZones.puzzle.repos = [{ name: "handy-calc-converter", description: "生活必備的單位轉換與多功能計算輕量小工具", html_url: "https://github.com/kaojarher/handy-calc-converter", homepage: "" }];
        }
        loadMockData();

        // ── 實時畫面預覽控制邏輯 ──
        let previewObserver = null;

        function isLivePagesUrl(url) {
            return url && url.startsWith('http') && !url.includes('github.com');
        }

        function injectIframePreview(cardEl, repoData) {
            const screenshotEl = cardEl.querySelector('.card-screenshot');
            if (!screenshotEl || screenshotEl.querySelector('.iframe-wrap')) return;

            const wrap = document.createElement('div');
            wrap.className = 'iframe-wrap';

            const iframe = document.createElement('iframe');
            iframe.src = repoData.homepage;
            iframe.setAttribute('loading', 'lazy');
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
            
            iframe.style.width = '1280px';
            iframe.style.height = '700px';

            function adjustScale() {
                const currentWidth = screenshotEl.offsetWidth || 300;
                const scaleFactor = currentWidth / 1280;
                iframe.style.transform = `scale(${scaleFactor})`;
                iframe.style.height = Math.ceil(160 / scaleFactor) + 'px';
            }
            adjustScale();

            iframe.onload = () => {
                wrap.classList.add('loaded');
                const shimmer = screenshotEl.querySelector('.shimmer');
                if (shimmer) shimmer.remove();
            };

            wrap.appendChild(iframe);
            screenshotEl.prepend(wrap);
        }

        function injectGithubSocialPreview(cardEl, repoData) {
            const screenshotEl = cardEl.querySelector('.card-screenshot');
            if (!screenshotEl || screenshotEl.querySelector('.preview-img')) return;

            const match = (repoData.html_url || '').match(/github\.com\/([^/]+)\/([^/?#]+)/);
            if (!match) return;

            const img = document.createElement('img');
            img.className = 'preview-img';
            img.src = `https://opengraph.githubassets.com/1/${match[1]}/${match[2]}`;
            img.alt = repoData.name;
            img.onload = () => {
                img.classList.add('loaded');
                const shimmer = screenshotEl.querySelector('.shimmer');
                if (shimmer) shimmer.remove();
            };
            img.onerror = () => img.remove();
            screenshotEl.prepend(img);
        }

        function triggerLazyLoadPreview(cardEl, repoData) {
            if (isLivePagesUrl(repoData.homepage)) {
                injectIframePreview(cardEl, repoData);
            } else if (repoData.html_url) {
                injectGithubSocialPreview(cardEl, repoData);
            }
        }

        function setupLazyPreviews(currentZoneRepos) {
            if (previewObserver) previewObserver.disconnect();
            
            previewObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const cardEl = entry.target;
                    const rIdx = parseInt(cardEl.dataset.ridx, 10);
                    if (isNaN(rIdx) || !currentZoneRepos[rIdx]) return;
                    
                    triggerLazyLoadPreview(cardEl, currentZoneRepos[rIdx]);
                    previewObserver.unobserve(cardEl);
                });
            }, { rootMargin: '100px' });

            document.querySelectorAll('.repo-item[data-ridx]').forEach(el => {
                previewObserver.observe(el);
            });
        }

        // ── 檢查專案是否包含任何遊戲關鍵字 ──
        function isGameRepo(repo) {
            const name = (repo.name || '').toLowerCase();
            const desc = (repo.description || '').toLowerCase();
            const topics = (repo.topics || []).map(t => String(t).toLowerCase());

            // 1. 檢查 Topics 標籤
            const hasGameTopic = topics.some(topic => GAME_BLACK_LIST.some(kw => topic.includes(kw)));
            if (hasGameTopic) return true;

            // 2. 檢查名稱與描述
            const fullText = name + ' ' + desc;
            return GAME_BLACK_LIST.some(kw => fullText.includes(kw));
        }

        // ── GitHub API 數據抓取 (深度淨化邏輯) ──
        async function fetchAndCategorize() {
            const username = document.getElementById('fetchUsername').value.trim();
            if (!username) { showToast("⚠️ 請輸入 GitHub 帳號"); return; }

            const btnText = document.getElementById('btnText');
            const statusEl = document.getElementById('fetchStatus');
            btnText.innerText = "⚡ 正在深度掃描...";
            statusEl.className = "fetch-status visible";
            statusEl.innerText = `正在過濾 @${username} 中所有遊戲/Game類別專案 (多重特徵深度黑名單)...`;

            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`);
                if (!response.ok) throw new Error("無法取得倉庫，請檢查帳號是否正確");
                
                const repos = await response.json();
                for (let key in parkZones) { parkZones[key].repos = []; }
                
                parkZones.mainstreet.repos.push({
                    name: `${username}.github.io`,
                    description: "kaojarher 數位車庫總控台與工具清單",
                    html_url: `https://github.com/${username}/${username}.github.io`,
                    homepage: `https://${username}.github.io`
                });

                let matchCount = 0;
                let filterOutCount = 0;

                repos.forEach(repo => {
                    if (isGameRepo(repo)) {
                        filterOutCount++;
                        return; // 確定為遊戲相關專案，徹底剔除
                    }

                    matchCount++;
                    const desc = repo.description || "";
                    const name = repo.name || "";
                    
                    const repoData = {
                        name: repo.name,
                        description: desc,
                        html_url: repo.html_url,
                        homepage: repo.homepage || (repo.has_pages ? `https://${username}.github.io/${repo.name}` : "")
                    };

                    const contentText = (name + desc).toLowerCase();
                    if (repo.stargazers_count > 10) {
                        parkZones.castle.repos.push(repoData);
                    } else if (contentText.includes("calc") || contentText.includes("convert") || contentText.includes("輕量") || contentText.includes("日常")) {
                        parkZones.puzzle.repos.push(repoData);
                    } else if (contentText.includes("api") || contentText.includes("script") || contentText.includes("auto") || contentText.includes("自動")) {
                        parkZones.adventure.repos.push(repoData);
                    } else {
                        parkZones.tomorrow.repos.push(repoData);
                    }
                });

                statusEl.innerText = `🔧 車庫淨化完成！成功排除 ${filterOutCount} 項遊戲專案，保留 ${matchCount} 項純正工具裝備。`;
                showToast(`🎉 成功獲得 ${matchCount} 項工具類裝備！`);
                showZone('castle');

            } catch (error) {
                statusEl.innerText = `❌ 錯誤: ${error.message}`;
                showToast("⚠️ 盤點失敗");
            } finally {
                btnText.innerText = "⚡ 盤點車庫工具";
            }
        }

        // ── 渲染右側分區卡片面版 ──
        function showZone(zoneKey) {
            const zone = parkZones[zoneKey];
            if (!zone) return;

            document.getElementById('panel-title').innerText = zone.title;
            const contentEl = document.getElementById('panel-content');

            let reposHtml = "";
            if (zone.repos.length === 0) {
                reposHtml = `<p style="color: var(--text-muted); font-style: italic; font-size: 0.9rem; margin-top: 10px;">🛠️ 目前此工具牆尚無符合條件的非遊戲裝備。</p>`;
            } else {
                zone.repos.forEach((repo, rIdx) => {
                    const liveUrl = repo.homepage || '';
                    const fallbackDisplayUrl = liveUrl || repo.html_url || 'No URL';

                    reposHtml += `
                        <div class="repo-item" id="repo-card-${rIdx}" data-ridx="${rIdx}">
                            <!-- 實時畫面預覽窗口頂部 -->
                            <div class="card-screenshot">
                                <div class="placeholder">
                                    <div class="emoji">🛠️</div>
                                    <div class="url-preview">${fallbackDisplayUrl}</div>
                                </div>
                                <div class="shimmer"></div>
                            </div>
                            <!-- 內容詳情 -->
                            <div class="repo-detail-wrap">
                                <div class="repo-name">⚙️ ${repo.name}</div>
                                <div class="repo-desc">${repo.description || "這個專案尚未編寫描述說明。"}</div>
                                <div class="repo-links">
                                    ${liveUrl ? `<a href="${liveUrl}" target="_blank" rel="noopener" class="repo-link">🚀 啟動工具 (Pages)</a>` : `<span style="font-size:0.75rem; color:var(--text-muted); text-align:center; width:100%; padding-top:4px;">(此專案無獨立部署頁面)</span>`}
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            contentEl.innerHTML = `
                <div class="zone-card">
                    <p style="font-size: 0.9rem; line-height: 1.5; color: var(--text-light); margin-bottom: 15px;">${zone.desc}</p>
                    <h4 style="font-size: 0.95rem; color: var(--neon-amber); border-bottom: 1px solid var(--metal-gray); padding-bottom: 5px;">🔧 工具裝備清單：</h4>
                    <div class="repos-scroll-container">
                        ${reposHtml}
                    </div>
                </div>
            `;

            if (zone.repos.length > 0) {
                requestAnimationFrame(() => setupLazyPreviews(zone.repos));
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // 默認加載車庫核心工具桌
        showZone('castle');
    </script>
</body>
</html>
